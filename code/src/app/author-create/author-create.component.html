<h2>Create Author</h2>
<form>
  <div>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div>
    <label for="bio">Biography:</label>
    <textarea id="bio" name="bio" required></textarea>
  </div>
  <button type="submit">Create Author</button>
</form>
